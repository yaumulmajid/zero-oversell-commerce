services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: stockguard
      POSTGRES_PASSWORD: stockguard
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockguard -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  reservation-service:
    build: ../services/reservation-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reservations
      DATABASE_USERNAME: stockguard
      DATABASE_PASSWORD: stockguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      RESERVATION_TTL_MINUTES: 20
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  campaign-service:
    build: ../services/campaign-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/campaigns
      DATABASE_USERNAME: stockguard
      DATABASE_PASSWORD: stockguard
      RESERVATION_SERVICE_URL: http://reservation-service:8081
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      reservation-service: { condition: service_started }

  payment-service:
    build: ../services/payment-service
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USERNAME: stockguard
      DATABASE_PASSWORD: stockguard
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  expiry-worker:
    build: ../services/expiry-worker
    environment:
      RESERVATION_SERVICE_URL: http://reservation-service:8081
      EXPIRY_POLL_MS: 5000
    ports: ["8083:8083"]
    depends_on:
      reservation-service: { condition: service_started }

volumes:
  postgres-data:
