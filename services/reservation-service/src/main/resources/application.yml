server:
  port: 8081
spring:
  application:
    name: reservation-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockguard}
    username: ${DATABASE_USERNAME:stockguard}
    password: ${DATABASE_PASSWORD:stockguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: reservation-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
stockguard:
  reservation-ttl-minutes: ${RESERVATION_TTL_MINUTES:20}
  outbox-poll-ms: ${OUTBOX_POLL_MS:500}
