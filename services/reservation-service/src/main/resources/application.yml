server:
  port: 8081
spring:
  application:
    name: reservation-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/stockguard}
    username: ${DATABASE_USERNAME:stockguard}
    password: ${DATABASE_PASSWORD:stockguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
stockguard:
  reservation-ttl-minutes: ${RESERVATION_TTL_MINUTES:20}
